server {
    listen 80;
    root /usr/share/nginx/html;

    # Allow uploads slightly above the backend's MAX_UPLOAD_MB default (25 MB)
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        # Streamed answers (/api/query/stream) must reach the browser as they are generated;
        # the backend also sends X-Accel-Buffering: no
        proxy_buffering off;
    }

    # Vite puts a content hash in every asset file name, so these never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html names the current assets: always revalidate it so a new deploy is picked up
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
